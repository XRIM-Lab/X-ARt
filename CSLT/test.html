<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSLT — First-person explorer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f5f5f5; overflow: hidden; font-family: ui-monospace, "Space Mono", "Courier New", monospace; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    .hud { position: fixed; z-index: 2; pointer-events: none; }
    .hud-top { top: 0; left: 0; padding: 0.9rem 1rem; }
    .hud-top h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.2em; }
    .hud-top .sub { margin: 0.15rem 0 0; font-size: 0.7rem; letter-spacing: 0.15em; opacity: 0.7; text-transform: uppercase; }
    #status { margin: 0.5rem 0 0; font-size: 0.75rem; opacity: 0.85; }
    .hud-actions { top: 0; right: 0; padding: 0.9rem 1rem; display: flex; gap: 0.5rem; }
    .hud-actions > * { pointer-events: auto; }
    .hud button, .hud-actions a {
      background: rgba(255,255,255,0.08); color: #f5f5f5; border: 1px solid rgba(255,255,255,0.35);
      font: inherit; font-size: 0.75rem; padding: 0.45rem 0.8rem; cursor: pointer; text-decoration: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .hud button:active, .hud-actions a:active { background: rgba(255,255,255,0.2); }
    .hud button[disabled] { opacity: 0.35; cursor: default; }
    #crosshair {
      top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%; background: rgba(255,255,255,0.55); pointer-events: none;
    }
    .hud-hints { bottom: 0; left: 0; right: 0; padding: 0.7rem 1rem; margin: 0; font-size: 0.68rem; opacity: 0.6; text-align: center; }
    .hud-hints-mobile { display: none; bottom: 0; left: 0; right: 0; padding: 0.7rem 1rem; margin: 0; font-size: 0.68rem; opacity: 0.6; text-align: center; }
    #touchPad { display: none; bottom: 3rem; left: 0; right: 0; justify-content: center; gap: 2.5rem; }
    #touchPad .cluster { display: grid; grid-template-columns: repeat(3, 3rem); grid-template-rows: repeat(2, 3rem); gap: 0.35rem; }
    #touchPad .cluster.vertical { grid-template-columns: repeat(2, 3rem); }
    #touchPad button {
      pointer-events: auto; background: rgba(255,255,255,0.08); color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.35); font: inherit; font-size: 1rem;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #touchPad button:active { background: rgba(255,255,255,0.25); }
    @media (max-width: 767px), (pointer: coarse) {
      #lookButton { display: none; }
      #touchPad { display: flex; }
      .hud-hints { display: none; }
      .hud-hints-mobile { display: block; }
      #crosshair { display: none; }
    }
    @media (max-width: 480px) {
      .hud-top { padding: 0.6rem 0.7rem; }
      .hud-actions { padding: 0.6rem 0.7rem; }
      .hud button, .hud-actions a { font-size: 0.68rem; padding: 0.4rem 0.6rem; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>

  <header class="hud hud-top">
    <h1>CSLT</h1>
    <p class="sub">First-person explorer</p>
    <p id="status" role="status">Loading…</p>
  </header>

  <div class="hud" id="crosshair" aria-hidden="true"></div>

  <nav class="hud hud-actions">
    <button id="lookButton" type="button" disabled>Click to look</button>
    <button id="resetButton" type="button" disabled>Reset view</button>
    <a href="./">Back to CSLT</a>
  </nav>

  <p class="hud hud-hints">Free-fly — no collisions, you can pass through points. WASD or arrows move · Q lower / E rise · Shift sprint · R reset · click to look or drag</p>
  <p class="hud hud-hints-mobile">Drag to look · hold buttons to move</p>

  <div class="hud" id="touchPad">
    <div class="cluster">
      <span></span><button type="button" data-move="forward" aria-label="Forward">▲</button><span></span>
      <button type="button" data-move="left" aria-label="Left">◀</button>
      <button type="button" data-move="back" aria-label="Back">▼</button>
      <button type="button" data-move="right" aria-label="Right">▶</button>
    </div>
    <div class="cluster vertical">
      <button type="button" data-move="rise" aria-label="Rise">Rise</button>
      <button type="button" data-move="lower" aria-label="Lower">Lower</button>
    </div>
  </div>

  <script type="module">
    import { startExplorer } from './explore.js';

    const ARTWORK_ROTATION_X_DEGREES = 15;
    const ARTWORK_ROTATION_Y_DEGREES = 12;
    const ARTWORK_ROTATION_Z_DEGREES = 90;
    startExplorer({ x: ARTWORK_ROTATION_X_DEGREES, y: ARTWORK_ROTATION_Y_DEGREES, z: ARTWORK_ROTATION_Z_DEGREES });
  </script>
</body>
</html>
