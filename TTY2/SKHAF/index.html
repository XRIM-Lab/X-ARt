<!DOCTYPE html>

<head>

  <!-- Bootstrap -->

  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../../style.css">
  
  <style>
      /* Simple override to ensure main content isn't hidden behind the fixed header */
      main {
          padding-top: 10vh;
          min-height: 100vh;
          background-color: #000; /* Assuming dark theme from original context */
      }
      .iframe-wrapper {
          width: 100%;
          height: calc(100vh - 50px); ; 
          display:flex;
          justify-content: center;
          align-items: center;
          margin-top: 50px;
      }
      iframe {
          width: 95%;
          height: 100%;
          max-width: 1200px;
          
      }
  </style>
</head>

<body>

 <header id="siteHeader" class="site-header">
    <div class="header-container site-container">
        <a href="#" class="header-brand">「X-ARt」</a>
        
        <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-nav">
            <span class="hamburger"></span>
        </button>
    </div>
    
    <nav id="main-nav" class="main-navigation site-container">
        <ul>
            <li class="has-dropdown">
                <a class="dropdown-toggle" role="button">Projects</a>
                <ul class="dropdown-menu">
                    <li><a href="../../TTY2/">Through The Years, To Touch You</a></li>
                                        <li><a href="../../EFV/">EQUUS: FORM + VOID</a></li>
                </ul>
            </li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

  <main class="site-container">
    <div class="iframe-wrapper">
        <iframe src="skhaf.htm"></iframe>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  // ============================
  // === MENU LOGIC           ===
  // ============================
  const siteHeader = document.getElementById('siteHeader');
  const menuToggle = document.querySelector('.menu-toggle');
  const mainNav = document.getElementById('main-nav');
  const navLinks = mainNav.querySelectorAll('a:not(.dropdown-toggle)');
  let autoCloseTimer = null;

  // 1. Force the menu to be visible immediately and permanently
  siteHeader.classList.add('is-visible');

  // Helper function to close the mobile nav
  function closeMobileNav() {
    if (document.body.classList.contains('nav-open')) {
      document.body.classList.remove('nav-open');
      menuToggle.setAttribute('aria-expanded', 'false');
      if (autoCloseTimer) {
        clearTimeout(autoCloseTimer);
      }
    }
  }

  // --- Mobile menu toggle (with auto-close) ---
  menuToggle.addEventListener('click', () => {
    const isNavOpen = document.body.classList.contains('nav-open');
    if (isNavOpen) {
      closeMobileNav();
    } else {
      document.body.classList.add('nav-open');
      menuToggle.setAttribute('aria-expanded', 'true');
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      autoCloseTimer = setTimeout(closeMobileNav, 5000); 
    }
  });

  // --- Close mobile menu when a nav link is clicked ---
  navLinks.forEach(link => {
    link.addEventListener('click', closeMobileNav);
  });

  // --- Dropdown Menu Logic (for mobile tap) ---
  const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
  dropdownToggles.forEach(toggle => {
    toggle.addEventListener('click', (event) => {
      // Only run this logic on mobile view for tap-to-expand
      if (window.innerWidth < 768) {
        event.preventDefault();
        const dropdownParent = toggle.parentElement;
        dropdownParent.classList.toggle('is-open');
      }
    });
  });
</script>
</body>
</html>
